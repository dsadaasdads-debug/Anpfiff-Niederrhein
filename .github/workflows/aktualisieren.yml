name: Meldungen aktualisieren

on:
  schedule:
    # Stündlich. Die krumme Minute ist Absicht: zur vollen Stunde ist die
    # Warteschlange bei GitHub am längsten, dann verzögern sich Läufe deutlich.
    - cron: '17 * * * *'
  workflow_dispatch:

# Zwei gleichzeitige Läufe würden sich beim Zurückschreiben in die Quere kommen.
concurrency:
  group: feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Feeds einsammeln
        run: node scripts/fetch.mjs

      - name: Ergebnis zurückschreiben
        run: |
          # --porcelain statt "git diff", weil die Dateien beim allerersten Lauf
          # noch unverfolgt sein können – "git diff" meldet dafür keine Änderung.
          # Der Zwischenspeicher muss mit, sonst holt jeder Lauf alle
          # Artikelseiten erneut, nur um sie wieder auszusortieren.
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "Keine neuen Meldungen – nichts zu committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json data/artikel-cache.json
          git commit -m "Meldungen aktualisiert ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # Der Tabellen-Workflow schreibt womoeglich zeitgleich; deshalb vor dem
          # Schieben neu aufsetzen statt am Konflikt zu scheitern.
          git pull --rebase --autostash origin main
          git push
