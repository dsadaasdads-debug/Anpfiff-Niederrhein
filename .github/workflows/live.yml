name: Spieltag

on:
  schedule:
    # Nur wenn tatsächlich gespielt wird: Freitagabend, Samstag- und
    # Sonntagnachmittag. Alle zehn Minuten – häufiger bringt nichts, weil
    # GitHub geplante Läufe unter Last ohnehin verzögert.
    - cron: '*/10 17-21 * * 5'
    - cron: '*/10 12-20 * * 6,0'
  workflow_dispatch:

concurrency:
  group: live
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ticker:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Spieltag abfragen
        run: node scripts/live.mjs

      - name: Ergebnis zurückschreiben
        run: |
          if [ -z "$(git status --porcelain -- data/live.json)" ]; then
            echo "Nichts Neues am Spieltag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -m "Spieltag aktualisiert ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git pull --rebase --autostash origin main
          git push
