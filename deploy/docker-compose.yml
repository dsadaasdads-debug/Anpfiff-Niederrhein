# Anpfiff Niederrhein
#
#   cd /opt/dienste/anpfiff && sudo docker compose up -d --build
#
# Caddy erreicht den Dienst über den Containernamen; nach außen ist kein Port
# geöffnet, genau wie beim Rust-Dashboard nebenan.

services:
  anpfiff:
    build:
      context: ./quelle
      dockerfile: deploy/Dockerfile
    container_name: anpfiff
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    volumes:
      # Die gesammelten Daten überleben einen Neubau des Containers.
      - anpfiff_daten:/app/data
    networks:
      - web
    healthcheck:
      # 127.0.0.1, nicht localhost: in Alpine loest localhost zuerst auf ::1
      # auf, der Dateiserver lauscht aber auf IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/index.html"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  anpfiff_daten:

networks:
  # Das Netz, in dem Caddy und die uebrigen Dienste haengen.
  web:
    external: true
